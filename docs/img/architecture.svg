<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 545" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1130" height="545" fill="#ffffff"/>

  <!-- ═══════════ Lane 1: training (offline) ═══════════ -->
  <text x="30" y="34" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1.5">TRAINING PIPELINE — OFFLINE, RUNS ONCE</text>

  <rect x="30" y="52" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="79" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Kaggle corpus</text>
  <text x="130" y="99" font-size="12" fill="#1e3a8a" text-anchor="middle">3,002,524 support tweets</text>

  <rect x="320" y="52" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="79" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6,000 clean</text>
  <text x="420" y="99" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">tickets</text>

  <rect x="610" y="52" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="710" y="79" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6,000 labeled</text>
  <text x="710" y="99" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">tickets</text>

  <rect x="900" y="52" width="200" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1000" y="79" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Qwen2.5-0.5B + LoRA</text>
  <text x="1000" y="99" font-size="12" fill="#1e3a8a" text-anchor="middle">adapters on the HF Hub</text>

  <line x1="236" y1="84" x2="312" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="274" y="60" font-size="11" fill="#475569" text-anchor="middle">filter airlines</text>
  <text x="274" y="74" font-size="11" fill="#475569" text-anchor="middle">clean · dedupe</text>

  <line x1="526" y1="84" x2="602" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="564" y="60" font-size="11" fill="#475569" text-anchor="middle">DeepSeek V4 Flash</text>
  <text x="564" y="74" font-size="11" fill="#475569" text-anchor="middle">JSON mode · &lt;$1</text>

  <line x1="816" y1="84" x2="892" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="854" y="60" font-size="11" fill="#475569" text-anchor="middle">LoRA fine-tune</text>
  <text x="854" y="74" font-size="11" fill="#475569" text-anchor="middle">Colab T4</text>

  <!-- gold set -->
  <line x1="710" y1="116" x2="710" y2="170" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <rect x="580" y="176" width="260" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="710" y="199" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">300-ticket gold set</text>
  <text x="710" y="218" font-size="11" fill="#92400e" text-anchor="middle">human-reviewed · excluded from training</text>
  <line x1="848" y1="192" x2="962" y2="124" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="925" y="170" font-size="11" font-style="italic" fill="#92400e" text-anchor="middle">evaluation</text>

  <!-- lane divider -->
  <line x1="30" y1="268" x2="1100" y2="268" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ═══════════ Lane 2: serving (online) ═══════════ -->
  <text x="30" y="300" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1.5">SERVING — ONLINE, EVERY REQUEST</text>

  <rect x="30" y="330" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="366" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Client</text>

  <line x1="186" y1="360" x2="252" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="219" y="348" font-size="11" fill="#475569" text-anchor="middle">POST /triage</text>

  <rect x="260" y="330" width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="345" y="355" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">AWS ALB</text>
  <text x="345" y="375" font-size="11" fill="#14532d" text-anchor="middle">HTTPS · health checks</text>

  <line x1="436" y1="360" x2="522" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="312" width="440" height="126" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="334" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">AWS ECS Fargate · Docker container</text>

  <rect x="560" y="352" width="160" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="387" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">FastAPI</text>

  <line x1="726" y1="382" x2="768" y2="382" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="776" y="352" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="861" y="387" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">merged 0.5B model</text>

  <!-- response arrow back to client -->
  <path d="M 750 438 L 750 492 L 105 492 L 105 396" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="512" font-size="11" fill="#475569" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">{"intent", "urgency", "abusive", "route_to", "low_confidence", ...}</text>

  <!-- HF Hub -> container -->
  <path d="M 1000 120 L 1000 286 L 890 286 L 890 306" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1012" y="200" font-size="11" fill="#475569">baked into the image</text>
  <text x="1012" y="215" font-size="11" fill="#475569">at docker build</text>
</svg>
